openapi: 3.0.3
info:
  title: Franchise Management API
  description: API for managing franchises, branches, and products
  version: 1.0.0
  contact:
    name: Nequi Team
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: '{protocol}://{host}:{port}'
    description: Custom server
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
      host:
        default: localhost
      port:
        default: '8080'

tags:
  - name: Franchise
    description: Franchise management operations
  - name: Branch
    description: Branch management operations
  - name: Product
    description: Product management operations

paths:
  /franchise/create:
    post:
      tags:
        - Franchise
      summary: Create a new franchise
      operationId: createFranchise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FranchiseDto'
            example:
              name: "Franchise 1"
      responses:
        '200':
          description: Franchise created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /franchise/rename:
    put:
      tags:
        - Franchise
      summary: Update franchise name
      operationId: updateFranchiseName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameFranchiseDto'
            example:
              id: 1
              name: "Updated Franchise Name"
      responses:
        '200':
          description: Franchise name updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request or franchise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branch/assign:
    post:
      tags:
        - Branch
      summary: Assign a new branch to a franchise
      operationId: assignBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchDto'
            example:
              name: "Branch 1"
              franchiseId: 1
      responses:
        '200':
          description: Branch assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request or franchise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /branch/rename:
    put:
      tags:
        - Branch
      summary: Update branch name
      operationId: updateBranchName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameBranchDto'
            example:
              id: 1
              name: "branch updated"
      responses:
        '200':
          description: Branch name updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /product/save:
    post:
      tags:
        - Product
      summary: Save a new product
      operationId: saveProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductDto'
            example:
              name: "product 1"
              branchId: 1
              stock: 100
      responses:
        '200':
          description: Product saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request or branch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /product/{productId}:
    delete:
      tags:
        - Product
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /product/updateStock:
    put:
      tags:
        - Product
      summary: Update product stock
      operationId: updateProductStock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStockProductDto'
            example:
              id: 1
              stock: 50
      responses:
        '200':
          description: Product stock updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /product/rename:
    put:
      tags:
        - Product
      summary: Update product name
      operationId: updateProductName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNameProductDto'
            example:
              id: 1
              name: "product updated"
      responses:
        '200':
          description: Product name updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /product/maxStockProducts/{franchiseId}:
    get:
      tags:
        - Product
      summary: Get products with maximum stock by franchise
      operationId: getMaxStockProducts
      parameters:
        - name: franchiseId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: "B200"
                  message:
                    type: string
                    example: "Operation carried out successfully."
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          description: Franchise not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FranchiseDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Franchise name
          example: "Franchise 1"

    UpdateNameFranchiseDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Franchise ID
          example: 1
        name:
          type: string
          description: New franchise name
          example: "Updated Franchise"

    BranchDto:
      type: object
      required:
        - name
        - franchiseId
      properties:
        name:
          type: string
          description: Branch name
          example: "Branch 1"
        franchiseId:
          type: integer
          format: int64
          description: Franchise ID
          example: 1

    UpdateNameBranchDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Branch ID
          example: 1
        name:
          type: string
          description: New branch name
          example: "Updated Branch"

    ProductDto:
      type: object
      required:
        - name
        - branchId
        - stock
      properties:
        name:
          type: string
          description: Product name
          example: "Product 1"
        branchId:
          type: integer
          format: int64
          description: Branch ID
          example: 1
        stock:
          type: integer
          format: int64
          description: Product stock quantity
          example: 100

    UpdateStockProductDto:
      type: object
      required:
        - id
        - stock
      properties:
        id:
          type: integer
          format: int64
          description: Product ID
          example: 1
        stock:
          type: integer
          format: int64
          description: New stock quantity
          example: 50

    UpdateNameProductDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Product ID
          example: 1
        name:
          type: string
          description: New product name
          example: "Updated Product"

    Franchise:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Franchise 1"

    Branch:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        franchiseId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Branch 1"

    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        branchId:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Product 1"
        stock:
          type: integer
          format: int64
          example: 100

    SuccessResponse:
      type: object
      properties:
        code:
          type: string
          example: "B200"
        message:
          type: string
          example: "Operation carried out successfully."
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "B400"
        message:
          type: string
          example: "Bad Request, please verify data"
        errors:
          type: array
          items:
            type: string
          example: ["name: must not be blank"]
